name: Build ZeppOS Package

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - "dist/**"
      - "README.md"

env:
  # Opt GitHub JavaScript actions into the upcoming Node.js 24 runtime.
  # The app build itself still uses Node.js 20 for Zeus CLI compatibility.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build HealthSync ZAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Zeus build
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: npm install

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli

      - name: Show app configuration
        run: |
          node -e "const app=require('./app.json'); console.log('appId:', app.app.appId); console.log('appName:', app.app.appName); console.log('version:', app.app.version.name);"

      - name: Clean old dist
        run: rm -rf dist

      - name: Build package
        run: zeus build

      - name: List build output
        run: find dist -maxdepth 2 -type f -print

      - name: Upload ZAB package
        uses: actions/upload-artifact@v4
        with:
          name: HealthSync-ZeppOS-package
          path: dist/*.zab
          if-no-files-found: error
          retention-days: 30
